<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>calmgap-tokyo — カームダウン・スペース 設置優先度マップ</title>
    <meta
      name="description"
      content="オープンデータから、カームダウン・クールダウンスペースを次に検討すべき区画を需要×負荷で算出し、根拠つきで示す行政向け分析ツール。示すのは 250m 区画であって特定の施設ではない。"
    />
  </head>
  <body>
    <div id="app">
      <aside id="controls" class="panel">
        <div class="panel-section">
          <h1>calmgap-tokyo</h1>
          <p class="subtitle">
            カームダウン・クールダウンスペース 設置優先度マップ
          </p>
          <!--
            **説明を画面に出す。** ここには以前タイトルしか無く、次に来るのが
            いきなり「1,058 区画 / 11.1%」だった。区画が何を指すのかを
            述べないまま数字だけを大きく出しても、大きいことしか伝わらない。
            文面の数値は meta.json から入れる（ここに直接書くと古くなる）。
          -->
          <p class="intro-lead" id="intro-lead"></p>
          <ol class="intro-steps">
            <li><b>地図の色が濃い区画</b>ほど優先度が高い（需要 × 負荷）。</li>
            <li>
              右の一覧が<b>優先順位そのもの</b>。行を選ぶと根拠が出ます。
            </li>
            <li>
              左のスライダーで<b>重視するものを変える</b>と、順位も提言も変わる。
            </li>
          </ol>
        </div>

        <!-- 模擬データ実行時のみ表示される。build.py が meta.synthetic で制御。 -->
        <div id="synthetic-banner" hidden></div>

        <div class="panel-section">
          <!--
            見出し数値は「何の数字か」を数字より先に置く。順番が逆だと、
            読み手は定義を知らないまま大きい数を見ることになる。
          -->
          <div class="stat">
            <div class="stat-kicker" id="stat-kicker">—</div>
            <div class="stat-value" id="stat-value">—</div>
            <div class="stat-label" id="stat-label">集計中…</div>
          </div>
        </div>

        <div class="panel-section" id="sensitivity" hidden></div>

        <div class="panel-section">
          <h2>地図に表示する値</h2>
          <div class="presets" id="display-modes"></div>
          <div class="preset-note" id="display-note"></div>
        </div>

        <div class="panel-section">
          <h2>重みプリセット（立場を変えてみる）</h2>
          <div class="presets" id="presets"></div>
          <div class="preset-note" id="preset-note"></div>
          <!--
            「立場が変われば上位も変わる」ことを、プリセットのすぐ隣で
            数値にする。感度分析の中に埋もれていると、押した人は辿り着かない。
          -->
          <div class="preset-agreement" id="preset-agreement" hidden></div>
        </div>

        <!--
          **スライダー 8 本がそのままデータの層（レイヤー）である**ことを
          見出しで言う。「重みを調整する」だけだと、何の重みなのかが
          画面のどこにも書かれていなかった。下の「地図に点を重ねる」の方が
          レイヤーらしく見える、という取り違えが実際に起きた。
        -->
        <div class="panel-section">
          <!--
            **見出しの「8」は meta から入れる。** ここに直接書いていたため、
            バナーの「実データ 10/10 レイヤー」と数が食い違って見え、
            外部から「8 なの 10 なの、意味が分からない」と指摘された。
            数の食い違いは書き換えて消すものではなく、
            **2 層がスコアに入らないという事実そのものが説明**である
            （etl/config.py の SUPPORT_LAYERS）。
          -->
          <h2 id="layer-heading">評価に使うデータ（レイヤー）</h2>
          <p class="section-note" id="layer-roles-note"></p>
          <div id="sliders"></div>
          <button class="ghost-btn" id="reset-btn" style="margin-top: 10px">
            既定値に戻す
          </button>
        </div>

        <div class="panel-section">
          <h2>地図に重ねる</h2>
          <p class="section-note">
            表示だけの切り替えです。スコアには影響しません。
            <b>点は押すと、名前・規模・出典が出ます。</b>
          </p>
          <div class="toggles">
            <label class="toggle">
              <input type="checkbox" id="toggle-demand" />
              <span class="swatch demand"></span>
              需要側の施設（事業所・学校・駅・クリニック）
            </label>
            <label class="toggle">
              <input type="checkbox" id="toggle-hosts" />
              <span class="swatch host"></span>
              既存の公共施設（徒歩圏にあるか の判定に使う）
            </label>
            <!--
              **上の見出し数値が指している区画そのもの。** 数字は画面で
              いちばん大きく出ているのに、それがどこなのかは地図に
              出ていなかった。点ではなく面なので、swatch も斜線にする。
            -->
            <label class="toggle">
              <input type="checkbox" id="toggle-unreachable" />
              <span class="swatch unreachable"></span>
              徒歩圏に公共施設が 1 件も無い区画
            </label>
          </div>
        </div>

        <!--
          出典は畳まない。都のオープンデータカタログの可視化事例は例外なく
          「説明 → 使用データセットの全列挙 → 作成日」を本文に出しており、
          出典を折り畳みの中に入れるのは行政向けの様式から外れる。
        -->
        <div class="panel-section">
          <h2>算出方法とデータ出典</h2>
          <div id="methodology"></div>
        </div>

        <!--
          「できないこと」を画面に出す。文書にしか無いと、画面が最も強く
          主張しているのは網羅性であって確からしさではない状態になる。
        -->
        <div class="panel-section">
          <details>
            <summary>この分析で分からないこと</summary>
            <div id="limitations"></div>
          </details>
        </div>
      </aside>

      <main id="map-wrap">
        <div id="map"></div>
        <div id="legend">
          <div class="legend-title">設置優先度</div>
          <div class="legend-ramp"></div>
          <!-- 真ん中の語は表示モードで変わる（優先度は実値・需要/負荷は順位）。 -->
          <div class="legend-scale">
            <span>低</span><span id="legend-scale-label">—</span><span>高</span>
          </div>
          <div class="legend-note" id="legend-note"></div>
        </div>
      </main>

      <aside id="detail" class="panel">
        <!--
          **タブは 2 つ。** かつては「提言リスト」と「表で見る」が別々にあったが、
          提言の単位を区画に戻した時点で、両者は同じ順位表の別表示でしかなくなった
          （根拠文も同じ関数の出力で、2 箇所に同じ文が出ていた）。
        -->
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" data-tab="ranking" aria-selected="true">
            提言（優先順位）
          </button>
          <button class="tab" role="tab" data-tab="selected" aria-selected="false">
            選択中の区画
          </button>
          <!--
            **合成後の順位表からは、層ごとの姿が見えない。** 優先度は 8 層を
            重み付きで足して掛けた値なので、「駅の乗降規模が大きいのはどこか」を
            画面から知る方法が無かった（内訳は選んだ 1 区画についてしか出ない）。
          -->
          <button class="tab" role="tab" data-tab="layers" aria-selected="false">
            レイヤー別
          </button>
          <div class="ranking-n" id="ranking-n"></div>
        </div>
        <div class="panel-section" id="detail-body"></div>
      </aside>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
