# CLAUDE.md の「変更したら必ず通す」を、人が覚えていなくても通るようにする。
#
# 検証は 3 本。どれも「壊れ方が静かな」箇所を見張るためにある。
#   1. selftest      … 不変条件と、間違いが黙って通らないこと
#   2. parity_check  … Python と TypeScript の同じ数式が一致すること
#   3. tsc           … フロントの型
#
# **parity_check は実データ・模擬データの両モードで走らせる。**
# 過去に模擬モードだけ落ちていたのを見落としている（丸め規則が
# Python と JavaScript で違い、模擬データでだけ「ちょうど半分」の値が
# 出ていた。docs/methodology.md 8.8）。
name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ローカルは 3.14 だが、CI は wheel の揃っている 3.12 に固定する。
      # 生成物は環境依存で 4 桁目がズレる（docs/issues.md B4）ので、
      # ここでは「再ビルドして差分が無いこと」は検査しない。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install geopandas pandas numpy shapely pyproj requests

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web

      - name: 不変条件テスト
        run: python -m etl.selftest

      - name: 型検査
        run: npx tsc --noEmit
        working-directory: web

      # 追跡してある配信データ（実データ 10/10）に対して検証する。
      - name: スコア一致（実データ）
        run: node tools/parity_check.mjs

      # 「過去の数字を引用しないこと」を機械的に守らせる。
      # 短期間に 4 回踏んでいて（selftest 45→58 件、到達不可の中位以上
      # 128→151 件、仮定員 68.9%→25.1%、帯域のラベル）、どれも
      # **間違っていても動く**種類の誤りだった。
      # **模擬データで作り直す前に走らせる**——実データの配信物を見るため。
      - name: 現況の数値と配信データの照合
        run: python tools/doc_numbers.py

      # 模擬データで作り直してから、同じ検証をもう一度。
      # web/public/data は上書きされるが CI の作業ツリー上だけの話。
      - name: スコア一致（模擬データ）
        run: |
          python -m etl.build
          node tools/parity_check.mjs
